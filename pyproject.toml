[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantity-validity-card"
version = "0.1.0"
description = "Quantity Validity Card (QVC) — human-verified medical quantity entailment benchmarks"
readme = "qvc/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qvc*"]
